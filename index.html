<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Rishi Music Icons</title>
</head>
<body style="background:#0c0f14; color:#fff; font-family:sans-serif; text-align:center; padding:40px;">
  <h2>Generating Valid PNG Icons...</h2>
  <p>Downloading <code>icon-192.png</code> and <code>icon-512.png</code>...</p>
  <script>
    function createIcon(dimension, filename) {
      const canvas = document.createElement("canvas");
      canvas.width = dimension;
      canvas.height = dimension;
      const ctx = canvas.getContext("2d");

      // Deep dark blue background
      const gradient = ctx.createLinearGradient(0, 0, dimension, dimension);
      gradient.addColorStop(0, "#08101e");
      gradient.addColorStop(1, "#02060d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, dimension, dimension);

      // Glowing circular border
      ctx.beginPath();
      ctx.arc(dimension / 2, dimension / 2, dimension * 0.38, 0, Math.PI * 2);
      ctx.lineWidth = dimension * 0.05;
      ctx.strokeStyle = "#00d2ff";
      ctx.shadowColor = "#1da1f2";
      ctx.shadowBlur = dimension * 0.08;
      ctx.stroke();

      // Music note glyph
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.floor(dimension * 0.36)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("♫", dimension / 2, dimension / 2);

      // Export binary PNG
      canvas.toBlob(function (blob) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      }, "image/png");
    }

    window.onload = function () {
      createIcon(192, "icon-192.png");
      setTimeout(() => createIcon(512, "icon-512.png"), 600);
    };
  </script>
</body>
</html>
